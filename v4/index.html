<body>
<div class="app-container">
  <div class="flex-between">
    <h1>🧠 Generador Universal de Agentes <span style="font-size:0.8rem;">v2.0 – Hexagonal Edition</span></h1>
    <div>
      <button id="cargarAgenteBtn" class="btn">📂 Cargar agente (JSON)</button>
      <button id="modoOscuroBtn" class="btn-secondary" style="margin-left:8px;">🌙</button>
    </div>
  </div>
  <div id="noAgente" class="card" style="text-align:center">
    <p>🔹 Carga un archivo <strong>agente.json</strong> o usa el ejemplo.</p>
    <button id="cargarEjemploBtn" class="btn-secondary">📥 Cargar agente de ejemplo (Recetas)</button>
  </div>
  <div id="agenteContainer" style="display:none">
    <div class="card" id="chatCard"></div>
    <div class="card" id="filtrosCard"></div>
    <div class="card" id="resultadosCard"></div>
  </div>
</div>
<div id="detalleModal" class="modal"><div class="modal-content"><button class="close-btn" id="closeModalBtn">&times;</button><h3 id="modalTitulo"></h3><div id="modalContenido"></div><a id="modalLink" target="_blank" class="btn-secondary">🔍 Buscar en Google</a></div></div>

<script>
// ============================================
// 🧩 EventBus: el mensajero. Sin esto, volvemos a la maraña.
// ============================================
class EventBus {
  constructor() { this._listeners = {}; }
  on(event, callback) {
    if (!this._listeners[event]) this._listeners[event] = [];
    this._listeners[event].push(callback);
    return () => this.off(event, callback); // retorna función para desuscribir
  }
  off(event, callback) {
    if (!this._listeners[event]) return;
    this._listeners[event] = this._listeners[event].filter(cb => cb !== callback);
  }
  emit(event, payload) {
    (this._listeners[event] || []).forEach(cb => cb(payload));
  }
}

// ============================================
// 🗃️ Persistencia: IndexedDB (cache) + localStorage (prefs). Encapsulada y aislada.
// ============================================
class PersistenceService {
  constructor() {
    this._dbPromise = window.idb ? window.idb.openDB('AgenteCache', 1, {
      upgrade(db) {
        if (!db.objectStoreNames.contains('datasets')) {
          db.createObjectStore('datasets', { keyPath: 'id' });
        }
      }
    }) : null;
  }

  async cacheDataset(agenteId, data, version) {
    if (!this._dbPromise) return false;
    const db = await this._dbPromise;
    const tx = db.transaction('datasets', 'readwrite');
    await tx.objectStore('datasets').put({ id: agenteId, data, version, lastUpdate: new Date().toISOString() });
    await tx.done;
    return true;
  }

  async getCachedDataset(agenteId) {
    if (!this._dbPromise) return null;
    const db = await this._dbPromise;
    return db.transaction('datasets', 'readonly').objectStore('datasets').get(agenteId);
  }

  loadPreferences(key) {
    const raw = localStorage.getItem(key);
    if (raw) {
      const p = JSON.parse(raw);
      return { valoraciones: p.valoraciones || {}, watchlist: p.watchlist || [] };
    }
    return { valoraciones: {}, watchlist: [] };
  }

  savePreferences(key, prefs) {
    localStorage.setItem(key, JSON.stringify(prefs));
  }

  loadDarkMode() {
    return localStorage.getItem('darkMode') === 'true';
  }

  saveDarkMode(enabled) {
    localStorage.setItem('darkMode', enabled);
  }
}

// ============================================
// 🧠 Lógica pura: el motor sin DOM. Resuelve filtros y sinónimos.
// ============================================
class AgentEngine {
  /** Aplica filtros a un dataset según los atributos definidos */
  static filterItems(dataset, filtros, atributos) {
    let results = [...dataset];
    for (const attr of atributos) {
      if (!attr.filtrable) continue;
      const filterValue = filtros[attr.id];
      if (!filterValue) continue;

      if (attr.tipo === 'categoria' && filterValue) {
        results = results.filter(item => item[attr.id] === filterValue);
      } else if (attr.tipo === 'numero') {
        const { min, max } = filterValue;
        if (min !== null || max !== null) {
          results = results.filter(item => {
            const val = item[attr.id];
            if (val === undefined) return true;
            if (min !== null && val < min) return false;
            if (max !== null && val > max) return false;
            return true;
          });
        }
      } else if (attr.tipo === 'tags' && Array.isArray(filterValue) && filterValue.length) {
        results = results.filter(item => {
          const tags = item[attr.id];
          return Array.isArray(tags) && filterValue.some(t => tags.includes(t));
        });
      }
    }
    return results;
  }

  /** Reinicia filtros a su estado por defecto */
  static resetFilters(atributos) {
    const filtros = {};
    for (const attr of atributos) {
      if (!attr.filtrable) continue;
      if (attr.tipo === 'numero') filtros[attr.id] = { min: null, max: null };
      else if (attr.tipo === 'categoria') filtros[attr.id] = '';
      else if (attr.tipo === 'tags') filtros[attr.id] = [];
    }
    return filtros;
  }

  /** Procesa texto usando sinónimos y devuelve un objeto de filtros parcial */
  static textToFilters(texto, sinonimos, atributos) {
    const lower = texto.toLowerCase();
    const nuevosFiltros = {};

    // Mapeo de sinónimos a valores de filtro
    if (sinonimos) {
      for (const [attrId, mapa] of Object.entries(sinonimos)) {
        for (const [clave, valor] of Object.entries(mapa)) {
          if (lower.includes(clave)) {
            nuevosFiltros[attrId] = valor;
          }
        }
      }
    }

    // Fallback: buscar categorías por nombre en el texto
    if (!nuevosFiltros.categoria) {
      for (const attr of atributos) {
        if (attr.tipo === 'categoria' && attr.opciones) {
          for (const opt of attr.opciones) {
            if (lower.includes(opt.toLowerCase())) {
              nuevosFiltros[attr.id] = opt;
              break;
            }
          }
        }
      }
    }
    return nuevosFiltros;
  }

  /** Calcula ordenación por valoraciones (likes suben) */
  static sortByValorations(items, valoraciones) {
    return [...items].sort((a, b) => {
      const va = valoraciones[a.id] === 'like' ? -1 : (valoraciones[a.id] === 'dislike' ? 1 : 0);
      const vb = valoraciones[b.id] === 'like' ? -1 : (valoraciones[b.id] === 'dislike' ? 1 : 0);
      return va - vb;
    });
  }
}

// ============================================
// 🎛️ State Manager: el almacén único. Cualquier cambio emite evento.
// ============================================
class AppState {
  constructor() {
    this.agente = null;
    this.dataset = [];
    this.filtros = {};
    this.valoraciones = {};
    this.watchlist = [];
    this.prefsKey = '';
  }

  update(newProps) {
    Object.assign(this, newProps);
    if (newProps.filtros !== undefined) {
      this.filtros = { ...this.filtros, ...newProps.filtros }; // merge parcial
    }
  }
}

// ============================================
// 🖼️ Componentes UI: cada uno maneja su trocito de DOM y habla por eventos.
// ============================================

class ChatUI {
  constructor(containerId, eventBus) {
    this.container = document.getElementById(containerId);
    this.bus = eventBus;
    this._buildDOM();
    this.bus.on('agent:loaded', () => this.clear());
  }

  _buildDOM() {
    this.container.innerHTML = `
      <div class="chat-container" id="chatMessages"></div>
      <div class="chat-options" id="chatOptions"></div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="chatInput" placeholder="Escribe algo... Ej: quiero algo barato y rápido">
        <button id="sendChatBtn" class="btn">Enviar</button>
      </div>
    `;
    this.messagesDiv = document.getElementById('chatMessages');
    this.input = document.getElementById('chatInput');
    this.sendBtn = document.getElementById('sendChatBtn');

    this.sendBtn.onclick = () => this._handleSend();
    this.input.onkeypress = (e) => { if (e.key === 'Enter') this._handleSend(); };
  }

  clear() {
    this.messagesDiv.innerHTML = '';
  }

  addMessage(text, sender) {
    const msg = document.createElement('div');
    msg.className = `chat-message ${sender}`;
    msg.textContent = text;
    this.messagesDiv.appendChild(msg);
    this.messagesDiv.scrollTop = this.messagesDiv.scrollHeight;
  }

  showSystemGreeting(descripcion) {
    if (descripcion) this.addMessage(`🤖 ${descripcion}`, 'bot');
    this.addMessage('Escribe "ayuda" para ver comandos.', 'bot');
  }

  _handleSend() {
    const txt = this.input.value.trim();
    if (!txt) return;
    this.addMessage(txt, 'user');
    this.input.value = '';
    this.bus.emit('chat:message', txt);
  }
}

class FilterUI {
  constructor(containerId, eventBus) {
    this.container = document.getElementById(containerId);
    this.bus = eventBus;
    this._updating = false; // evita bucles al repintar por cambio de estado
    this.container.innerHTML = '<h3>🔍 Filtros</h3><div id="filtrosDinamicos" class="filters-panel"></div><button id="aplicarFiltrosBtn" class="btn-secondary">Aplicar filtros</button>';
    this.panel = document.getElementById('filtrosDinamicos');
    document.getElementById('aplicarFiltrosBtn').onclick = () => this.bus.emit('filter:apply');

    this.bus.on('state:filtersChanged', (filtros) => {
      if (this._updating) return;
      this.render(filtros);
    });
    this.bus.on('agent:loaded', () => this.render({}));
  }

  render(filtros = {}) {
    this._updating = true;
    this.panel.innerHTML = '';
    const state = window._appState; // pequeño atajo para no pasar estado a cada UI (en prod se inyectaría)
    if (!state.agente) { this._updating = false; return; }

    for (const attr of state.agente.atributos) {
      if (!attr.filtrable) continue;
      const group = document.createElement('div');
      group.className = 'filter-group';
      const label = document.createElement('label');
      label.textContent = attr.nombre;
      group.appendChild(label);

      const current = filtros[attr.id] || state.filtros[attr.id] || AgentEngine.resetFilters([attr])[attr.id];

      if (attr.tipo === 'categoria') {
        const select = document.createElement('select');
        select.id = `filtro_${attr.id}`;
        const emptyOpt = document.createElement('option'); emptyOpt.value = ''; emptyOpt.textContent = 'Todos';
        select.appendChild(emptyOpt);
        attr.opciones.forEach(opt => {
          const option = document.createElement('option'); option.value = opt; option.textContent = opt;
          select.appendChild(option);
        });
        select.value = current || '';
        select.onchange = () => this.bus.emit('filter:changed', { [attr.id]: select.value });
        group.appendChild(select);
      } else if (attr.tipo === 'numero') {
        const wrapper = document.createElement('div'); wrapper.style.display = 'flex'; wrapper.style.gap = '4px';
        const minInput = document.createElement('input'); minInput.type = 'number'; minInput.placeholder = 'Min';
        minInput.value = current?.min ?? '';
        const maxInput = document.createElement('input'); maxInput.type = 'number'; maxInput.placeholder = 'Max';
        maxInput.value = current?.max ?? '';
        const onChange = () => this.bus.emit('filter:changed', {
          [attr.id]: { min: minInput.value ? Number(minInput.value) : null, max: maxInput.value ? Number(maxInput.value) : null }
        });
        minInput.onchange = onChange; maxInput.onchange = onChange;
        wrapper.appendChild(minInput); wrapper.appendChild(maxInput);
        group.appendChild(wrapper);
      } else if (attr.tipo === 'tags') {
        const divTags = document.createElement('div'); divTags.style.display = 'flex'; divTags.style.flexWrap = 'wrap'; divTags.style.gap = '6px';
        attr.opciones.forEach(tag => {
          const container = document.createElement('div'); container.style.display = 'inline-flex'; container.style.alignItems = 'center'; container.style.gap = '2px';
          const chk = document.createElement('input'); chk.type = 'checkbox'; chk.value = tag; chk.id = `tag_${attr.id}_${tag}`;
          if (Array.isArray(current) && current.includes(tag)) chk.checked = true;
          const lbl = document.createElement('label'); lbl.htmlFor = chk.id; lbl.textContent = tag; lbl.style.fontSize = '0.8rem';
          container.appendChild(chk); container.appendChild(lbl);
          chk.onchange = () => {
            const selected = Array.from(divTags.querySelectorAll('input:checked')).map(cb => cb.value);
            this.bus.emit('filter:changed', { [attr.id]: selected });
          };
          divTags.appendChild(container);
        });
        group.appendChild(divTags);
      }
      this.panel.appendChild(group);
    }
    this._updating = false;
  }
}

class ResultListUI {
  constructor(containerId, eventBus) {
    this.container = document.getElementById(containerId);
    this.bus = eventBus;
    this.container.innerHTML = `
      <div class="flex-between"><h3>📋 Resultados</h3><span id="resultCount"></span></div>
      <div id="resultadosLista"></div>
      <div style="margin-top:16px; border-top:1px solid #e9eef2; padding-top:12px;">
        <div class="flex-between"><h3>⭐ Favoritos</h3><button id="clearWatchlistBtn" class="btn-secondary">Vaciar</button></div>
        <div id="watchlistContainer"></div>
      </div>
    `;
    this.listaDiv = document.getElementById('resultadosLista');
    this.countSpan = document.getElementById('resultCount');
    this.watchlistDiv = document.getElementById('watchlistContainer');
    document.getElementById('clearWatchlistBtn').onclick = () => this.bus.emit('watchlist:clear');

    this.bus.on('state:resultsUpdated', (results) => this.renderResults(results));
    this.bus.on('state:watchlistUpdated', (watchlist) => this.renderWatchlist(watchlist));
  }

  renderResults(results) {
    this.listaDiv.innerHTML = '';
    const limit = 20;
    const mostrar = results.slice(0, limit);
    const state = window._appState;
    for (const item of mostrar) {
      const card = document.createElement('div'); card.className = 'item-card';
      const poster = document.createElement('div'); poster.className = 'item-poster'; poster.textContent = '📄';
      const info = document.createElement('div'); info.className = 'item-info';
      const titulo = item.titulo || item.nombre || item.id;
      info.innerHTML = `<div class="item-title">${titulo}</div>`;
      state.agente.atributos.filter(a => a.visible && a.id !== 'imagen').forEach(attr => {
        if (item[attr.id] !== undefined) {
          let valor = Array.isArray(item[attr.id]) ? item[attr.id].join(', ') : item[attr.id];
          info.innerHTML += `<span class="badge">${attr.nombre}: ${valor}</span>`;
        }
      });
      const actions = document.createElement('div'); actions.className = 'actions';
      const favBtn = document.createElement('button'); favBtn.className = 'btn-icon';
      favBtn.textContent = state.watchlist.includes(item.id) ? '⭐' : '☆';
      favBtn.onclick = (e) => { e.stopPropagation(); this.bus.emit('watchlist:toggle', item.id); };
      const likeBtn = document.createElement('button'); likeBtn.className = 'btn-icon'; likeBtn.textContent = '👍';
      likeBtn.style.color = state.valoraciones[item.id] === 'like' ? 'green' : 'gray';
      likeBtn.onclick = (e) => { e.stopPropagation(); this.bus.emit('valoracion:set', { id: item.id, value: 'like' }); };
      const dislikeBtn = document.createElement('button'); dislikeBtn.className = 'btn-icon'; dislikeBtn.textContent = '👎';
      dislikeBtn.style.color = state.valoraciones[item.id] === 'dislike' ? 'red' : 'gray';
      dislikeBtn.onclick = (e) => { e.stopPropagation(); this.bus.emit('valoracion:set', { id: item.id, value: 'dislike' }); };
      const infoBtn = document.createElement('button'); infoBtn.className = 'btn-icon'; infoBtn.textContent = '🔍';
      infoBtn.onclick = (e) => { e.stopPropagation(); this.bus.emit('modal:show', item); };
      actions.appendChild(favBtn); actions.appendChild(likeBtn); actions.appendChild(dislikeBtn); actions.appendChild(infoBtn);
      info.appendChild(actions);
      card.appendChild(poster); card.appendChild(info);
      this.listaDiv.appendChild(card);
    }
    this.countSpan.textContent = `${results.length} resultados`;
  }

  renderWatchlist(watchlist) {
    this.watchlistDiv.innerHTML = '';
    const state = window._appState;
    const items = watchlist.map(id => state.dataset.find(i => i.id === id)).filter(i => i);
    if (items.length === 0) {
      this.watchlistDiv.innerHTML = '<div style="padding:8px; text-align:center">Sin favoritos</div>';
      return;
    }
    items.forEach(item => {
      const div = document.createElement('div'); div.className = 'watchlist-item';
      div.innerHTML = `<span><strong>${item.titulo || item.nombre || item.id}</strong></span><button class="btn-icon" data-id="${item.id}">❌</button>`;
      div.querySelector('button').onclick = () => this.bus.emit('watchlist:toggle', item.id);
      this.watchlistDiv.appendChild(div);
    });
  }
}

class ModalUI {
  constructor(eventBus) {
    this.bus = eventBus;
    this.modal = document.getElementById('detalleModal');
    this.titulo = document.getElementById('modalTitulo');
    this.contenido = document.getElementById('modalContenido');
    this.link = document.getElementById('modalLink');
    document.getElementById('closeModalBtn').onclick = () => this.close();
    window.onclick = (e) => { if (e.target === this.modal) this.close(); };
    this.bus.on('modal:show', (item) => this.show(item));
  }

  show(item) {
    this.titulo.textContent = item.titulo || item.nombre || item.id;
    let html = '';
    const state = window._appState;
    state.agente.atributos.filter(a => a.visible).forEach(attr => {
      if (item[attr.id] !== undefined) {
        let valor = Array.isArray(item[attr.id]) ? item[attr.id].join(', ') : item[attr.id];
        html += `<p><strong>${attr.nombre}:</strong> ${valor}</p>`;
      }
    });
    this.contenido.innerHTML = html;
    this.link.href = `https://www.google.com/search?q=${encodeURIComponent(item.titulo || item.nombre || item.id)}`;
    this.modal.style.display = 'flex';
  }

  close() {
    this.modal.style.display = 'none';
  }
}

// ============================================
// 🚀 App: cablea todo, maneja ciclo de vida.
// ============================================
class App {
  constructor() {
    this.bus = new EventBus();
    this.persistence = new PersistenceService();
    this.state = new AppState();
    window._appState = this.state; // acceso rápido para componentes (evita DI compleja)

    // UI
    this.chatUI = new ChatUI('chatCard', this.bus);
    this.filterUI = new FilterUI('filtrosCard', this.bus);
    this.resultUI = new ResultListUI('resultadosCard', this.bus);
    this.modalUI = new ModalUI(this.bus);

    // Eventos
    this.bus.on('chat:message', (text) => this._handleChatMessage(text));
    this.bus.on('filter:changed', (partialFilters) => this._updateFilters(partialFilters));
    this.bus.on('filter:apply', () => this._applyFilters());
    this.bus.on('watchlist:toggle', (id) => this._toggleWatchlist(id));
    this.bus.on('watchlist:clear', () => this._clearWatchlist());
    this.bus.on('valoracion:set', ({ id, value }) => this._setValoracion(id, value));

    // Modo oscuro
    this._initDarkMode();
  }

  async cargarAgenteDesdeArchivo(file) {
    try {
      const config = JSON.parse(await file.text());
      await this._iniciarAgente(config);
    } catch (e) {
      alert('Error al cargar agente: ' + e.message);
    }
  }

  async _iniciarAgente(config) {
    if (!config.meta || !config.atributos) throw new Error('JSON inválido');

    let dataset = [];
    if (config.dataSource?.type === 'remote' && config.dataSource.url) {
      const agenteId = config.meta.nombre.replace(/\s/g, '_').toLowerCase();
      const version = config.dataSource.version || '1.0';
      const cached = await this.persistence.getCachedDataset(agenteId);
      if (cached && cached.version === version) {
        dataset = cached.data;
        this.chatUI.addMessage('📦 Datos cargados desde caché local.', 'bot');
      } else {
        this.chatUI.addMessage('⬇️ Descargando datos...', 'bot');
        const resp = await fetch(config.dataSource.url);
        if (!resp.ok) throw new Error('Error descargando datos');
        const ct = resp.headers.get('content-type');
        if (ct && ct.includes('text/csv')) {
          const csvText = await resp.text();
          const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
          dataset = parsed.data;
        } else {
          dataset = await resp.json();
        }
        await this.persistence.cacheDataset(agenteId, dataset, version);
        this.chatUI.addMessage('✅ Datos descargados y guardados.', 'bot');
      }
    } else if (config.dataSource?.type === 'local' && config.dataSource.data) {
      dataset = config.dataSource.data;
    } else if (config.datos) {
      dataset = config.datos;
    } else {
      throw new Error('Dataset no encontrado');
    }
    if (!Array.isArray(dataset) || dataset.length === 0) throw new Error('Dataset vacío');

    // Configurar estado
    const filtros = AgentEngine.resetFilters(config.atributos);
    const prefsKey = `agente_${config.meta.nombre.replace(/\s/g, '_')}`;
    const prefs = this.persistence.loadPreferences(prefsKey);

    this.state.update({
      agente: config,
      dataset,
      filtros,
      valoraciones: prefs.valoraciones,
      watchlist: prefs.watchlist,
      prefsKey
    });

    document.getElementById('noAgente').style.display = 'none';
    document.getElementById('agenteContainer').style.display = 'block';

    this.bus.emit('agent:loaded', config);
    this.chatUI.showSystemGreeting(config.meta.descripcion);
    this._applyFilters();
  }

  _handleChatMessage(text) {
    if (text.toLowerCase() === 'ayuda') {
      this.chatUI.addMessage("Comandos: 'quiero [categoría]', 'busca [atributo] [valor]'. Ej: 'comida barata', 'película larga'.", 'bot');
      return;
    }
    const nuevosFiltros = AgentEngine.textToFilters(text, this.state.agente.sinonimos, this.state.agente.atributos);
    // Reseteamos filtros y aplicamos los detectados
    const reset = AgentEngine.resetFilters(this.state.agente.atributos);
    const merged = { ...reset, ...nuevosFiltros };
    this.state.update({ filtros: merged });
    this.bus.emit('state:filtersChanged', merged);
    this._applyFilters();
    const desc = Object.entries(merged).filter(([k,v]) => v && (typeof v !== 'object' || v.min || v.max || (Array.isArray(v) && v.length))).map(([k,v]) => `${k}: ${JSON.stringify(v)}`).join(', ') || 'ninguno';
    this.chatUI.addMessage(`🔍 Filtros aplicados: ${desc}`, 'bot');
  }

  _updateFilters(partial) {
    const updated = { ...this.state.filtros, ...partial };
    this.state.update({ filtros: updated });
    this.bus.emit('state:filtersChanged', updated);
  }

  _applyFilters() {
    const filtrados = AgentEngine.filterItems(this.state.dataset, this.state.filtros, this.state.agente.atributos);
    const ordenados = AgentEngine.sortByValorations(filtrados, this.state.valoraciones);
    this.bus.emit('state:resultsUpdated', ordenados);
    this.bus.emit('state:watchlistUpdated', this.state.watchlist);
  }

  _toggleWatchlist(id) {
    const idx = this.state.watchlist.indexOf(id);
    if (idx >= 0) this.state.watchlist.splice(idx, 1);
    else this.state.watchlist.push(id);
    this._savePrefs();
    this._applyFilters();
  }

  _clearWatchlist() {
    this.state.watchlist = [];
    this._savePrefs();
    this._applyFilters();
  }

  _setValoracion(id, value) {
    this.state.valoraciones[id] = value;
    this._savePrefs();
    this._applyFilters();
  }

  _savePrefs() {
    if (!this.state.prefsKey) return;
    this.persistence.savePreferences(this.state.prefsKey, {
      valoraciones: this.state.valoraciones,
      watchlist: this.state.watchlist
    });
  }

  _initDarkMode() {
    if (this.persistence.loadDarkMode()) {
      document.body.classList.add('dark');
      document.getElementById('modoOscuroBtn').textContent = '☀️';
    }
    document.getElementById('modoOscuroBtn').onclick = () => {
      const isDark = document.body.classList.toggle('dark');
      this.persistence.saveDarkMode(isDark);
      document.getElementById('modoOscuroBtn').textContent = isDark ? '☀️' : '🌙';
    };
  }
}

};
